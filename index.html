<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Demo Kamera</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 10px;
  background: #111;
  color: white;
  text-align: center;
}

h1 { font-size: 22px; }

input {
  width: 90%;
  padding: 15px;
  font-size: 18px;
  margin-bottom: 10px;
  border-radius: 10px;
  border: none;
}

button {
  width: 95%;
  padding: 15px;
  font-size: 18px;
  margin: 5px 0;
  border-radius: 10px;
  border: none;
}

.ok { background: #2ecc71; }
.warn { background: #f39c12; }
.dup { background: #e74c3c; }

#status {
  margin: 10px;
  font-size: 22px;
  font-weight: bold;
}

.counter {
  margin-top: 10px;
  font-size: 16px;
}

.list {
  margin-top: 15px;
  text-align: left;
  font-size: 14px;
}

.item {
  padding: 5px;
  border-bottom: 1px solid #444;
}
</style>
</head>

<body>

<h1>QR Scan Demo</h1>

<input id="qrInput" placeholder="Scanna / skriv kod">

<button onclick="scan()" class="ok">Scan manuellt</button>
<button onclick="fakeScan()">Test Scan</button>
<button onclick="startScanner()">Starta kamera</button>

<div id="reader" style="width:100%; margin-top:10px;"></div>

<div id="status">Väntar...</div>

<div class="counter">
Totalt: <span id="total">0</span> |
Dubletter: <span id="dups">0</span>
</div>

<div class="list" id="list"></div>

<script src="https://unpkg.com/html5-qrcode"></script>

<script>
let scans = [];
let dupCount = 0;
let scanner = null;

// ------------------- SCAN LOGIK -------------------

function scan() {
  let value = document.getElementById("qrInput").value.trim();
  if (!value) return;
  processScan(value);
  document.getElementById("qrInput").value = "";
}

function fakeScan() {
  let value = "ID-" + Math.floor(Math.random()*5);
  processScan(value);
}

function processScan(value) {
  let status = document.getElementById("status");

  let exists = scans.includes(value);

  if (exists) {
    status.innerText = "DUPLIKAT!";
    status.style.color = "red";
    dupCount++;
    beep(200, 100);
    vibrate();
  } else {
    status.innerText = "OK";
    status.style.color = "lime";
    scans.push(value);
    beep(800, 100);
  }

  updateUI(value, exists);
}

// ------------------- UI -------------------

function updateUI(value, isDup) {
  document.getElementById("total").innerText = scans.length;
  document.getElementById("dups").innerText = dupCount;

  let list = document.getElementById("list");

  let item = document.createElement("div");
  item.className = "item";
  item.innerText =
    new Date().toLocaleTimeString() + " - " + value + (isDup ? " (DUP)" : "");

  list.prepend(item);

  if (list.children.length > 10) {
    list.removeChild(list.lastChild);
  }
}

// ------------------- KAMERA -------------------

function startScanner() {
  if (scanner) return;

  scanner = new Html5Qrcode("reader");

  scanner.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 250 },
    (decodedText) => {
      processScan(decodedText);

      // Stoppa efter scan (demo-läge)
      scanner.stop();
      scanner = null;
    },
    (error) => {}
  ).catch(err => {
    alert("Kunde inte starta kamera: " + err);
  });
}

// ------------------- Ljud + vibration -------------------

function beep(freq, duration) {
  let ctx = new (window.AudioContext || window.webkitAudioContext)();
  let osc = ctx.createOscillator();
  osc.frequency.value = freq;
  osc.connect(ctx.destination);
  osc.start();
  setTimeout(() => osc.stop(), duration);
}

function vibrate() {
  if (navigator.vibrate) {
    navigator.vibrate(200);
  }
}
</script>

</body>
</html>
