<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Demo Kamera</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 10px;
  background: #111;
  color: white;
  text-align: center;
}

h1 { font-size: 22px; }

input {
  width: 90%;
  padding: 15px;
  font-size: 18px;
  margin-bottom: 10px;
  border-radius: 10px;
  border: none;
}

button {
  width: 95%;
  padding: 15px;
  font-size: 18px;
  margin: 5px 0;
  border-radius: 10px;
  border: none;
  cursor: pointer;
}

.ok { background: #2ecc71; color: #000; }
.lamp-off { background: #333; color: #fff; }
.lamp-on  { background: #f1c40f; color: #000; }

#status {
  margin: 10px;
  font-size: 22px;
  font-weight: bold;
}

.counter { margin-top: 10px; font-size: 16px; }
.list { margin-top: 15px; text-align: left; font-size: 14px; }
.item { padding: 5px; border-bottom: 1px solid #444; }

/* ------------------- POPUP ------------------- */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.85);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px;
  z-index: 100;
}
.modal[hidden] { display: none; }

.modal-box {
  width: 100%;
  max-width: 420px;
  background: #1c1c1c;
  border: 1px solid #333;
  border-radius: 14px;
  padding: 12px;
}

.modal-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}
.modal-head strong { font-size: 18px; }

.modal-head .close {
  width: 44px;
  height: 44px;
  margin: 0;
  padding: 0;
  font-size: 20px;
  background: #333;
  color: #fff;
}

#reader { width: 100%; border-radius: 10px; overflow: hidden; background: #000; }

.modal-box #lampBtn { width: 100%; margin-top: 10px; }

#camMsg { margin-top: 8px; font-size: 14px; color: #bbb; min-height: 18px; }
</style>
</head>

<body>

<h1>QR Scan Demo</h1>

<input id="qrInput" placeholder="Scanna / skriv kod">

<button onclick="scan()" class="ok">Scan manuellt</button>
<button onclick="fakeScan()">Test Scan</button>
<button onclick="startScanner()">Starta kamera</button>

<div id="status">Väntar...</div>

<div class="counter">
Totalt: <span id="total">0</span> |
Dubletter: <span id="dups">0</span>
</div>

<div class="list" id="list"></div>

<!-- Kamera-popup -->
<div id="camModal" class="modal" hidden>
  <div class="modal-box">
    <div class="modal-head">
      <strong>Skanna QR</strong>
      <button class="close" onclick="stopScanner()" aria-label="Stäng kameran">✕</button>
    </div>
    <div id="reader"></div>
    <button id="lampBtn" class="lamp-off" onclick="toggleLampa()" hidden>🔦 Lampan PÅ</button>
    <div id="camMsg"></div>
  </div>
</div>

<script src="https://unpkg.com/html5-qrcode"></script>

<script>
let scans = [];
let dupCount = 0;
let scanner = null;
let torchOn = false;
let scanHandled = false;

// ------------------- SCAN LOGIK -------------------

function scan() {
  let value = document.getElementById("qrInput").value.trim();
  if (!value) return;
  processScan(value);
  document.getElementById("qrInput").value = "";
}

function fakeScan() {
  processScan("ID-" + Math.floor(Math.random() * 5));
}

function processScan(value) {
  let status = document.getElementById("status");
  let exists = scans.includes(value);

  if (exists) {
    status.innerText = "DUPLIKAT!";
    status.style.color = "red";
    dupCount++;
    beep(200, 100);
    vibrate();
  } else {
    status.innerText = "OK";
    status.style.color = "lime";
    scans.push(value);
    beep(800, 100);
  }

  updateUI(value, exists);
}

// ------------------- UI -------------------

function updateUI(value, isDup) {
  document.getElementById("total").innerText = scans.length;
  document.getElementById("dups").innerText = dupCount;

  let list = document.getElementById("list");
  let item = document.createElement("div");
  item.className = "item";
  item.innerText = new Date().toLocaleTimeString() + " - " + value + (isDup ? " (DUP)" : "");
  list.prepend(item);

  if (list.children.length > 10) list.removeChild(list.lastChild);
}

// ------------------- KAMERA I POPUP -------------------

function openModal()  { document.getElementById("camModal").hidden = false; }
function closeModal() { document.getElementById("camModal").hidden = true; }

function setMsg(text) { document.getElementById("camMsg").textContent = text || ""; }

async function startScanner() {
  if (scanner) return;

  scanHandled = false;
  torchOn = false;
  setMsg("");
  resetLampBtn();
  document.getElementById("lampBtn").hidden = true;
  openModal();

  scanner = new Html5Qrcode("reader");

  try {
    await scanner.start(
      { facingMode: "environment" },
      {
        fps: 10,
        qrbox: (w, h) => {
          const s = Math.floor(Math.min(w, h) * 0.7);
          return { width: s, height: s };
        }
      },
      onScanSuccess,
      () => {}
    );
    setupLamp();
  } catch (err) {
    scanner = null;
    closeModal();
    alert("Kunde inte starta kamera: " + err);
  }
}

function onScanSuccess(decodedText) {
  if (scanHandled) return;
  scanHandled = true;
  processScan(decodedText);
  stopScanner();
}

async function stopScanner() {
  if (scanner) {
    const s = scanner;
    scanner = null;
    try { await s.stop(); } catch (e) {}
    try { s.clear(); } catch (e) {}
  }
  torchOn = false;
  closeModal();
}

window.addEventListener("keydown", (e) => {
  if (e.key === "Escape") stopScanner();
});

// ------------------- LAMPA (använder samma kameraström som skannern) -------------------

function getVideoTrack() {
  const video = document.querySelector("#reader video");
  const stream = video && video.srcObject;
  return stream ? stream.getVideoTracks()[0] : null;
}

function resetLampBtn() {
  const btn = document.getElementById("lampBtn");
  btn.textContent = "🔦 Lampan PÅ";
  btn.className = "lamp-off";
}

function setupLamp() {
  const btn = document.getElementById("lampBtn");
  const track = getVideoTrack();
  const caps = track && track.getCapabilities ? track.getCapabilities() : {};

  if (caps.torch) {
    btn.hidden = false;
  } else {
    btn.hidden = true;
    setMsg("Ficklampa stöds inte av kameran i den här webbläsaren.");
  }
}

async function toggleLampa() {
  const track = getVideoTrack();
  if (!track) return;

  const btn = document.getElementById("lampBtn");
  const next = !torchOn;

  try {
    await track.applyConstraints({ advanced: [{ torch: next }] });
    torchOn = next;
    btn.textContent = torchOn ? "🔦 Lampan AV" : "🔦 Lampan PÅ";
    btn.className = torchOn ? "lamp-on" : "lamp-off";
  } catch (err) {
    setMsg("Kunde inte ändra lampan: " + err);
  }
}

// ------------------- LJUD + VIBRATION -------------------

function beep(freq, duration) {
  let ctx = new (window.AudioContext || window.webkitAudioContext)();
  let osc = ctx.createOscillator();
  osc.frequency.value = freq;
  osc.connect(ctx.destination);
  osc.start();
  setTimeout(() => osc.stop(), duration);
}

function vibrate() {
  if (navigator.vibrate) navigator.vibrate(200);
}
</script>

</body>
</html>
